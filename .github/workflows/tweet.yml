name: Daily scheduled tweet

on:
  schedule:
    # Daily at 08:17 East Africa Time (05:17 UTC), away from the busy hour boundary.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without posting to X
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-tweet
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts
      
      - name: Post tweet
        run: node postTweetGithub.js
